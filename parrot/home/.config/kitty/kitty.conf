# ==============================================================================
# KITTY TERMINAL CONFIGURATION - PARROT PENTESTING ELEGANT EDITION
# ==============================================================================

# Font Configuration
font_family      JetBrainsMono Nerd Font
bold_font        JetBrainsMono Nerd Font Bold
italic_font      JetBrainsMono Nerd Font Italic
bold_italic_font JetBrainsMono Nerd Font Bold Italic
font_size        11.5

disable_ligatures never

# Transparency & Glassmorphism
background_opacity 0.82
dynamic_background_opacity yes
background_tint 0.35
dim_opacity 0.80

# Window Layout
window_padding_width 12 16
hide_window_decorations yes
window_border_width 1pt
remember_window_size yes
confirm_os_window_close 0

# Cursor
cursor_shape block
cursor_blink_interval 0.7 ease-in-out
# Estela suave del cursor al saltar
cursor_trail 3
cursor_trail_decay 0.08 0.3
cursor_trail_start_threshold 3
cursor_stop_blinking_after 15.0

# Scrollback
scrollback_lines 10000

# Mouse
url_style curly
open_url_with default
detect_urls yes
copy_on_select yes
mouse_hide_wait 3.0

# Performance
repaint_delay 10
input_delay 3
sync_to_monitor yes

# Bell
enable_audio_bell no
visual_bell_duration 0.0

# Tab Bar Style
tab_bar_style powerline
tab_bar_edge top
tab_powerline_style round
tab_bar_min_tabs 2
tab_bar_margin_height 4 0
tab_title_template " {index}  {title[:28]} "
active_tab_font_style   bold
inactive_tab_font_style normal

# Clipboard & Shell
clipboard_control write-clipboard write-primary read-clipboard read-primary
# zsh solo dentro de kitty (la shell del sistema sigue siendo bash)
shell /usr/bin/zsh
shell_integration enabled
term xterm-256color

# ==============================================================================
# COLOR SCHEME - generado desde el fondo de pantalla por themegen
# ==============================================================================
include ~/.cache/hyprshell/kitty-colors.conf

# ==============================================================================
# KEYBINDINGS
# ==============================================================================
map ctrl+shift+c copy_to_clipboard
map ctrl+shift+v paste_from_clipboard

map ctrl+shift+equal change_font_size all +1.0
map ctrl+shift+minus change_font_size all -1.0
map ctrl+shift+0 change_font_size all 0

map ctrl+shift+t new_tab
map ctrl+shift+q close_tab
map ctrl+shift+right next_tab
map ctrl+shift+left previous_tab

map ctrl+shift+enter new_window
map ctrl+shift+w close_window
map ctrl+shift+] next_window
map ctrl+shift+[ previous_window

# Opacity hotkeys
map ctrl+shift+a>m set_background_opacity +0.05
map ctrl+shift+a>l set_background_opacity -0.05
map ctrl+shift+a>1 set_background_opacity 1.0

# Ctrl+Shift+F pasa a los programas (buscar en el proyecto en nvim, como VSCode)
map ctrl+shift+f no_op
