# Espectro de audio para la barra de Quickshell (modules/bar/Spectrum.qml)
[general]
bars = 20
framerate = 50
autosens = 1
sleep_timer = 2

[input]
method = pulse
source = auto

[output]
method = raw
raw_target = /dev/stdout
data_format = ascii
ascii_max_range = 100
bar_delimiter = 59
frame_delimiter = 10
channels = mono

[smoothing]
monstercat = 1
noise_reduction = 0.6
