# hypridle - bloqueo e inactividad (generado con la shell hyprshell)
# Bloquea con la pantalla de Quickshell; si la shell no esta corriendo, usa hyprlock como respaldo.
general {
    lock_cmd = pidof qs >/dev/null && qs ipc call lock lock || pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch dpms on
}

# 10 min sin actividad -> bloquear
listener {
    timeout = 600
    on-timeout = loginctl lock-session
}

# 20 min -> apagar monitores (se encienden al mover raton o teclado)
listener {
    timeout = 1200
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}

# Sin suspension automatica: escaneos y VPN siguen corriendo
