# ##############################################################################
# HYPRLAND CONFIGURATION - PARROT CAELESTIA HTB ELEGANT EDITION
# ##############################################################################

autogenerated = 0

# ------------------------------------------------------------------------------
# MONITORS (DP-2 LEFT, DP-1 RIGHT)
# ------------------------------------------------------------------------------
monitor = DP-2, 1920x1080@60, 0x0, 1
monitor = DP-1, 1920x1080@75, 1920x0, 1
monitor = , preferred, auto, 1

# Espacios de trabajo: 1-5 en el monitor principal (izquierdo), 6-10 en el secundario
workspace = 1, monitor:DP-2, default:true
workspace = 2, monitor:DP-2
workspace = 3, monitor:DP-2
workspace = 4, monitor:DP-2
workspace = 5, monitor:DP-2
workspace = 6, monitor:DP-1, default:true
workspace = 7, monitor:DP-1
workspace = 8, monitor:DP-1
workspace = 9, monitor:DP-1
workspace = 10, monitor:DP-1

# ------------------------------------------------------------------------------
# DEFAULT PROGRAMS
# ------------------------------------------------------------------------------
$terminal = kitty
$fileManager = dolphin
$menu = rofi -show drun  # respaldo; el lanzador principal es la shell (Super+R)

# ------------------------------------------------------------------------------
# AUTOSTART DAEMONS (FAST PARALLEL INITIALIZATION)
# ------------------------------------------------------------------------------
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP &
exec-once = systemctl --user import-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP &
exec-once = ~/.config/hypr/scripts/persist-log.sh
exec-once = /usr/libexec/hyprpolkitagent &
exec-once = qs &
exec-once = wl-paste --watch ~/.local/bin/hyprshell-clip store
exec-once = hyprctl setcursor Bibata-Modern-Classic 24
exec-once = hypridle &

# ------------------------------------------------------------------------------
# ENVIRONMENT VARIABLES FOR INPUT, DRM & CURSOR
# ------------------------------------------------------------------------------
# Apps con la paleta del fondo (solo en Hyprland; la sesion de Plasma no cambia).
# Los navegadores se excluyen en ~/.local/share/applications (ver themegen-apps).
env = GTK_THEME,hyprshell
# Agente SSH (systemd: ssh-agent.socket): la llave se desbloquea una vez por sesion
env = SSH_AUTH_SOCK,/run/user/1000/openssh_agent
env = QT_QPA_PLATFORMTHEME,qt6ct
env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24
env = XCURSOR_THEME,Bibata-Modern-Classic
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland
env = XDG_SESSION_DESKTOP,Hyprland
env = QT_QPA_PLATFORM,wayland;xcb
env = GDK_BACKEND,wayland,x11,*

# ------------------------------------------------------------------------------
# CURSOR & MOUSE STABILITY SETTINGS
# ------------------------------------------------------------------------------
cursor {
    no_hardware_cursors = 2
    no_warps = false
    enable_hyprcursor = false
    sync_gsettings_theme = true
    default_monitor = DP-2
}

# ------------------------------------------------------------------------------
# LOOK AND FEEL (CAELESTIA / GLASSMORPHISM)
# ------------------------------------------------------------------------------
general {
    gaps_in = 5
    gaps_out = 10
    border_size = 2
    col.active_border = rgba(cba6f7ee) rgba(89b4faee) 45deg
    col.inactive_border = rgba(313244aa)
    resize_on_border = true
    allow_tearing = false
    layout = dwindle
}

decoration {
    rounding = 12
    active_opacity = 0.88
    inactive_opacity = 0.80

    # Blur mas suave (se intuye el fondo) pero oscurecido para que el texto se lea bien
    blur {
        enabled = true
        size = 6
        passes = 2
        new_optimizations = true
        ignore_opacity = true
        xray = false
        brightness = 0.80
        contrast = 0.90
        vibrancy = 0.20
        noise = 0.015
    }

    shadow {
        enabled = true
        range = 15
        render_power = 3
        color = rgba(1a1a1aee)
    }
}

# Colores generados desde el fondo de pantalla (themegen); sobrescriben los de arriba
source = ~/.cache/hyprshell/hyprland-colors.conf

# ------------------------------------------------------------------------------
# CAELESTIA ANIMATIONS
# ------------------------------------------------------------------------------
animations {
    enabled = true

    # Mismas curvas que la shell, el bloqueo y el inicio de sesion (sin rebote):
    #   emphasized      -> entra rapido y frena suave   (Theme.curve de la shell)
    #   emphasizedAccel -> sale acelerando
    #   standard        -> cambios sutiles (fundidos, bordes)
    bezier = emphasized, 0.05, 0.7, 0.1, 1
    bezier = emphasizedAccel, 0.3, 0, 0.8, 0.15
    bezier = standard, 0.2, 0, 0, 1
    bezier = linear, 0, 0, 1, 1

    # Velocidad en decimas de segundo (3.2 = 320 ms, como Theme.durNormal)
    animation = windowsIn, 1, 4, emphasized, popin 90%
    animation = windowsOut, 1, 2.5, emphasizedAccel, popin 90%
    animation = windowsMove, 1, 4, emphasized, slide
    animation = fade, 1, 3.2, standard
    animation = border, 1, 3.2, standard
    animation = workspaces, 1, 4.5, emphasized, slidefade 12%
    animation = specialWorkspace, 1, 4, emphasized, slidefadevert 15%
    # Las capas de la shell ya animan su propio contenido: aqui solo un fundido corto
    animation = layers, 1, 2, standard, fade
}


# ------------------------------------------------------------------------------
# LAYOUTS & PERFORMANCE MISC
# ------------------------------------------------------------------------------
dwindle {
    preserve_split = true
}

master {
    new_status = master
}

misc {
    # Si la pantalla de bloqueo se cae, permite que otra la reemplace (sin quedar atrapado)
    allow_session_lock_restore = true
    force_default_wallpaper = 0
    disable_hyprland_logo = true
    disable_splash_rendering = true
}

# ------------------------------------------------------------------------------
# INPUT & KEYBOARD
# ------------------------------------------------------------------------------
input {
    kb_layout = es,us
    kb_variant =
    kb_model =
    kb_options = grp:alt_shift_toggle
    kb_rules =
    follow_mouse = 1
    sensitivity = 0
    numlock_by_default = true

    touchpad {
        natural_scroll = true
    }
}

gesture = 3, horizontal, workspace

# ------------------------------------------------------------------------------
# WINDOW RULES
# ------------------------------------------------------------------------------
# Ventana flotante para fijar objetivo HTB (waybar > Target)
# Mosaico total: toda ventana nueva entra en mosaico (nada se superpone)...
windowrule = match:class .*, tile on
# ...salvo las que deben flotar: dialogos modales, contrasenas, selectores de archivo e imagen-en-imagen
windowrule = match:modal true, float on, center on
windowrule = match:class ^(hyprpolkitagent|org.kde.polkit-kde-authentication-agent-1|polkit-gnome-authentication-agent-1|pinentry-.*|gcr-prompter)$, float on, center on
windowrule = match:class ^(xdg-desktop-portal-gtk|xdg-desktop-portal-kde|org.freedesktop.impl.portal.desktop.kde|zenity)$, float on, center on
windowrule = match:title ^(Picture.in.[Pp]icture|Imagen en imagen)$, float on, pin on
windowrule = match:class ^(htb-target)$, float on, size 520 160, center on
windowrule = match:class ^(hyprshell-pkg)$, float on, size 860 460, center on

# Navegadores y reproductores siempre opacos (videos, lectura)
windowrule = match:class ^(brave-browser|brave-.*|firefox.*|librewolf|chromium|google-chrome|zen.*)$, opacity 1.0 override 1.0 override
windowrule = match:class ^(mpv|vlc|org.videolan.VLC|celluloid|io.github.celluloid_player.Celluloid)$, opacity 1.0 override 1.0 override

# Desenfoque detras de la barra de la shell (Quickshell)
layerrule = match:namespace hyprshell-bar, blur on, ignore_alpha 0.3
layerrule = match:namespace hyprshell-overlay, blur on, ignore_alpha 0.5
layerrule = match:namespace hyprshell-notifications, blur on, ignore_alpha 0.5
layerrule = match:namespace hyprshell-center, blur on, ignore_alpha 0.5
layerrule = match:namespace hyprshell-osd, blur on, ignore_alpha 0.5
layerrule = match:namespace hyprshell-overview, blur on, ignore_alpha 0.3
layerrule = match:namespace hyprshell-control, blur on, ignore_alpha 0.5
layerrule = match:namespace hyprshell-popout, blur on, ignore_alpha 0.5

# ------------------------------------------------------------------------------
# KEYBINDINGS
# ------------------------------------------------------------------------------
$mainMod = SUPER

# Core App Binds
bind = $mainMod, RETURN, exec, $terminal
bind = $mainMod, Q, killactive,
bind = $mainMod SHIFT, M, exec, ~/.config/hypr/scripts/logout.sh
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, V, global, hyprshell:clipboard
bind = $mainMod SHIFT, V, togglefloating,
bind = $mainMod, R, global, hyprshell:launcher
bind = $mainMod, W, global, hyprshell:wallpaper
bind = $mainMod SHIFT, E, global, hyprshell:power
bind = $mainMod, P, pseudo,
bind = $mainMod, J, layoutmsg, togglesplit

# SwayNC Caelestia Notification Panel
bind = $mainMod, N, global, hyprshell:notifications
bind = $mainMod, I, global, hyprshell:packages
bind = $mainMod, Tab, global, hyprshell:overview
bind = $mainMod, C, global, hyprshell:control

# Hyprlock Screen Lock
bind = $mainMod, L, exec, loginctl lock-session

# Screenshot (Region to Clipboard)
# Capturas (guardan en ~/Pictures/Capturas + portapapeles + aviso)
bind = $mainMod SHIFT, S, exec, ~/.config/hypr/scripts/screenshot.sh zona
bind = , Print, exec, ~/.config/hypr/scripts/screenshot.sh pantalla
bind = $mainMod, Print, exec, ~/.config/hypr/scripts/screenshot.sh ventana

# Audio / Volume
binde = , XF86AudioRaiseVolume, exec, pamixer --allow-boost --set-limit 150 -i 5
binde = , XF86AudioLowerVolume, exec, pamixer --allow-boost -d 5
bind = , XF86AudioMute, exec, pamixer -t
bind = , XF86AudioMicMute, exec, pamixer --default-source -t

# Brightness
binde = , XF86MonBrightnessUp, exec, brightnessctl set 5%+
binde = , XF86MonBrightnessDown, exec, brightnessctl set 5%-

# Window Focus Binds
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

# Switch Workspaces
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Move Window to Workspace
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# Move/Resize Windows with Mouse
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow
